global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spike-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]
  - job_name: mock-webhook
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-webhook:8091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
